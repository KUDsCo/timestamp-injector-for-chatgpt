<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      width: 250px;
      color: #333;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
    }
    .setting-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      font-weight: 600;
    }
    select, input[type="color"] {
      width: 100%;
      padding: 4px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    input[type="color"] {
      height: 30px;
      padding: 0;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      color: green;
      min-height: 15px;
    }
  </style>
</head>
<body>
  <h2>Timestamp Settings</h2>

  <div class="setting-group">
    <label for="color">Color</label>
    <input type="color" id="color" value="#888888">
  </div>

  <div class="setting-group">
    <label for="fontSize">Font Size</label>
    <select id="fontSize">
      <option value="0.75rem">Small</option>
      <option value="0.875rem" selected>Medium</option>
      <option value="1rem">Large</option>
    </select>
  </div>

  <div class="setting-group">
    <label for="format">Format</label>
    <select id="format">
      <option value="default" selected>YYYY/MM/DD HH:mm:ss</option>
      <option value="short">MM/DD HH:mm</option>
      <option value="time">HH:mm:ss</option>
    </select>
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
